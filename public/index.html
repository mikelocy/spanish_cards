<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c8442b">
<title>Spanish Flashcards</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Español">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="wrap">

  <!-- ── Card ────────────────────────────────────────────── -->
  <section id="study" class="study" hidden>
    <header class="study-head">
      <div class="head-mid">
        <h1 id="deck-title"></h1>
        <p id="deck-source" class="sub"></p>
      </div>
      <button id="speak" class="icon-btn speak" aria-label="Hear it in Spanish" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path class="wave wave-1" d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path class="wave wave-2" d="M18.6 5.9a8 8 0 0 1 0 12.2" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="star" class="icon-btn star" aria-label="Star this word — practice it more">&#9734;</button>
      <button id="skip" class="icon-btn skip" aria-label="I know this one — skip it from now on">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <p id="counter" class="counter"></p>
    </div>

    <div id="card" class="card" role="button" tabindex="0" aria-label="Flashcard, tap to flip">
      <div class="card-inner">
        <div class="face front">
          <span id="front-lang" class="lang"></span>
          <p id="front-text" class="word"></p>
          <button id="replay" class="replay" type="button" aria-label="Play it again" hidden>
            <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
              <path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
              <path d="M18.6 5.9a8 8 0 0 1 0 12.2" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <span id="front-from" class="from"></span>
        </div>
        <div class="face back">
          <span id="back-lang" class="lang"></span>
          <p id="back-text" class="word"></p>
          <p id="back-spanish" class="back-es" hidden></p>
          <p id="back-note" class="note"></p>
        </div>
      </div>
    </div>

    <p id="study-empty" class="empty"></p>

    <div class="nav">
      <button id="prev" class="nav-btn" aria-label="Previous card">&larr;</button>
      <button id="flip" class="nav-btn flip-btn">Flip</button>
      <button id="next" class="nav-btn" aria-label="Next card">&rarr;</button>
    </div>

    <div class="tools">
      <button id="dir" class="tool">ES &rarr; EN</button>
      <button id="shuffle" class="tool">Shuffle: off</button>
      <button id="filter" class="tool">All words</button>
      <button id="listen" class="tool" hidden>Listen: off</button>
    </div>
  </section>

  <!-- ── Sets ────────────────────────────────────────────── -->
  <section class="sets">
    <div class="sets-head">
      <h2 class="sets-title">Sets</h2>
      <button id="select-all" class="link-btn">Select all</button>
    </div>
    <p class="sets-hint">Tick more than one to practice them together.</p>
    <div id="deck-list" class="deck-list"></div>
    <p id="home-empty" class="empty" hidden>No card sets yet.</p>
    <p class="add-cta"><a href="/add">+ Add words from a photo</a></p>
  </section>

</main>
<script src="/app.js"></script>
</body>
</html>
